# nginx server block for api.validformat.online -> formatter-backend (Symfony)
#
# Install:
#   sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/api.validformat.online
#   sudo ln -s /etc/nginx/sites-available/api.validformat.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before that:
#   - point an A/AAAA DNS record for api.validformat.online at this server's IP
#   - check the php-fpm socket path/version below matches what's actually installed
#     (`ls /var/run/php/`) - this project requires PHP >= 8.1
#   - get a cert once the DNS record resolves: sudo certbot --nginx -d api.validformat.online
#     (certbot will rewrite this file to add the ssl_certificate/listen 443 lines and the
#     http->https redirect - the block below is deliberately plain HTTP to start from)

server {
    listen 80;
    listen [::]:80;
    server_name api.validformat.online;
    root /var/www/formatter-backend/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # deny direct access to any other PHP file - only index.php (the front
    # controller) may run, matching Symfony's official recommended config
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 4m;

    error_log /var/log/nginx/api.validformat.online_error.log;
    access_log /var/log/nginx/api.validformat.online_access.log;
}
